services:

  # ─── Nginx Reverse Proxy (single public entry point) ─────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-society}_nginx
    restart: always
    environment:
      NGINX_PORT:           ${NGINX_PORT}
      NGINX_ADMIN_USER:     ${NGINX_ADMIN_USER:-admin}
      NGINX_ADMIN_PASSWORD: ${NGINX_ADMIN_PASSWORD}
    ports:
      - "0.0.0.0:${NGINX_PORT}:${NGINX_PORT}"
    volumes:
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${NGINX_PORT}/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - society_net

  # ─── Primary Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-society}_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-society_events}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-society_events}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - society_net

  # ─── pgAdmin 4 (Database GUI) — served at /pgadmin/ ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ${COMPOSE_PROJECT_NAME:-society}_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:              ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:           ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:              "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED:         "False"
      PGADMIN_CONFIG_LOGIN_BANNER:             "'Society Events — DB Admin'"
      # Tells pgAdmin's own Flask app it's mounted under /pgadmin (sets
      # APPLICATION_ROOT/SESSION_COOKIE_PATH) so its own generated asset URLs,
      # redirects, and AJAX calls are correctly prefixed — without this, pgAdmin
      # emits root-relative paths (e.g. /static/..., /browser/...) that only
      # work when accessed via the dedicated subdomain, not the /pgadmin/ path.
      SCRIPT_NAME:                              "/pgadmin"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    # No host port — accessed through nginx at /pgadmin/ (basic auth required)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/pgadmin/misc/ping | grep -q PING"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Redis (Session cache / rate-limiting) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-society}_redis
    restart: always
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - society_net

  # ─── PgBouncer — connection pooler in front of `postgres` ──────────────────
  # Fronts only the shared `postgres` container (user/event/registration/ticket/
  # payment-service) — visitor-service's dedicated `visitor-postgres` has no
  # connection-count contention with the other 5 and stays direct for now.
  # Image's built-in entrypoint writes userlist.txt from DB_USER/DB_PASSWORD and
  # generates pgbouncer.ini from these env vars — no custom command/Dockerfile
  # needed. `POOL_MODE=transaction` requires asyncpg's statement_cache_size=0
  # (see shared/db.py) — without it, "prepared statement does not exist" errors
  # occur under load.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: ${COMPOSE_PROJECT_NAME:-society}_pgbouncer
    restart: always
    environment:
      DB_USER:             ${POSTGRES_USER}
      DB_PASSWORD:          ${POSTGRES_PASSWORD}
      DB_HOST:              postgres
      DB_PORT:              ${POSTGRES_PORT}
      DB_NAME:              ${POSTGRES_DB:-society_events}
      LISTEN_PORT:          "6432"
      AUTH_TYPE:            scram-sha-256
      POOL_MODE:            transaction
      MAX_CLIENT_CONN:      "500"
      DEFAULT_POOL_SIZE:    "25"
      RESERVE_POOL_SIZE:    "5"
      ADMIN_USERS:          ${POSTGRES_USER}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - society_net


  # ─── MinIO — S3-compatible object storage for user/registration/visitor/
  # payment-service uploads (avatars, payment screenshots, visitor photos) ────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${COMPOSE_PROJECT_NAME:-society}_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - society_net

  # One-shot: creates the `uploads` bucket + anonymous-download policy, then exits.
  # `restart: "no"` — it's meant to run once per fresh MinIO volume, not loop.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${COMPOSE_PROJECT_NAME:-society}_minio_init
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/uploads
        mc anonymous set download local/uploads
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - society_net

  # ─── User Service (port 3001) ─────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    restart: always
    environment:
      DB_HOST:           pgbouncer
      DB_PORT:           6432
      DB_NAME:           ${POSTGRES_DB:-society_events}
      # Own DB role (user_role), not the shared POSTGRES_USER — see
      # DB_ISOLATION_PLAN.md / db/migrations/035_user_service_schema_isolation.sql.
      DB_USER:           ${USER_DB_USER}
      DB_PASSWORD:       ${USER_DB_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      APP_PUBLIC_URL:            ${APP_PUBLIC_URL}
      KEYCLOAK_ADMIN_USER:       ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD:   ${KEYCLOAK_ADMIN_PASSWORD}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      SOCIETY_NAME:              ${SOCIETY_NAME:-GM Global Techies Town}
      SOCIETY_SHORT_NAME:        ${SOCIETY_SHORT_NAME:-GMGT}
      SOCIETY_CITY:              ${SOCIETY_CITY:-Bengaluru}
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
      AUTH_SERVICE_URL:          ${AUTH_SERVICE_URL:-http://host.containers.internal:8000}
      AUTH_SERVICE_API_KEY:      ${AUTH_SERVICE_API_KEY:-}
      OTP_BRIDGE_CLIENT_ID:      ${OTP_BRIDGE_CLIENT_ID:-otp-bridge}
      OTP_BRIDGE_CLIENT_SECRET:  ${OTP_BRIDGE_CLIENT_SECRET:-}
      GMAIL_SMTP_USER:           ${GMAIL_SMTP_USER:-}
      GMAIL_APP_PASSWORD:        ${GMAIL_APP_PASSWORD:-}
      MINIO_ENDPOINT:            http://minio:9000
      MINIO_ACCESS_KEY:          ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY:          ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:              uploads
    volumes:
      - user_uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Event Service (port 3002) ───────────────────────────────────────────
  event-service:
    build:
      context: .
      dockerfile: services/event/Dockerfile
    restart: always
    environment:
      DB_HOST:           pgbouncer
      DB_PORT:           6432
      DB_NAME:           ${POSTGRES_DB:-society_events}
      # Own DB role (event_role), not the shared POSTGRES_USER — see
      # DB_ISOLATION_PLAN.md / db/migrations/033_event_service_schema_isolation.sql.
      # Works transparently through pgbouncer: the [databases] entry's
      # auth_user=${POSTGRES_USER} plus PgBouncer's default auth_query lets any
      # Postgres role authenticate without a userlist.txt/pgbouncer config change,
      # as long as POSTGRES_USER can read pg_shadow (true for the default superuser).
      DB_USER:           ${EVENT_DB_USER}
      DB_PASSWORD:       ${EVENT_DB_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      APP_PUBLIC_URL:            ${APP_PUBLIC_URL}
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
      SOCIETY_UPI_ID:            ${SOCIETY_UPI_ID:-}
      SOCIETY_UPI_NAME:          ${SOCIETY_UPI_NAME:-}
      SOCIETY_BANK_NAME:         ${SOCIETY_BANK_NAME:-}
      SOCIETY_BANK_ACCOUNT:      ${SOCIETY_BANK_ACCOUNT:-}
      SOCIETY_BANK_IFSC:         ${SOCIETY_BANK_IFSC:-}
      SOCIETY_BANK_BENEFICIARY:  ${SOCIETY_BANK_BENEFICIARY:-}
      AUTH_SERVICE_URL:          ${AUTH_SERVICE_URL:-http://host.containers.internal:8000}
      AUTH_SERVICE_API_KEY:      ${AUTH_SERVICE_API_KEY:-}
      GMAIL_SMTP_USER:           ${GMAIL_SMTP_USER:-}
      GMAIL_APP_PASSWORD:        ${GMAIL_APP_PASSWORD:-}
      REDIS_HOST:                redis
      REDIS_PORT:                ${REDIS_PORT:-6379}
      REDIS_PASSWORD:            ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Registration Service (port 3005) ──────────────────────────────────────
  registration-service:
    build:
      context: .
      dockerfile: services/registration/Dockerfile
    restart: always
    environment:
      DB_HOST:           pgbouncer
      DB_PORT:           6432
      DB_NAME:           ${POSTGRES_DB:-society_events}
      # Own DB role (registration_role), not the shared POSTGRES_USER — see
      # DB_ISOLATION_PLAN.md / db/migrations/037_registration_service_schema_isolation.sql.
      DB_USER:           ${REGISTRATION_DB_USER}
      DB_PASSWORD:       ${REGISTRATION_DB_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      APP_PUBLIC_URL:            ${APP_PUBLIC_URL}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
      AUTH_SERVICE_URL:          ${AUTH_SERVICE_URL:-http://host.containers.internal:8000}
      AUTH_SERVICE_API_KEY:      ${AUTH_SERVICE_API_KEY:-}
      SOCIETY_UPI_ID:            ${SOCIETY_UPI_ID:-}
      SOCIETY_UPI_NAME:          ${SOCIETY_UPI_NAME:-}
      SOCIETY_BANK_NAME:         ${SOCIETY_BANK_NAME:-}
      SOCIETY_BANK_ACCOUNT:      ${SOCIETY_BANK_ACCOUNT:-}
      SOCIETY_BANK_IFSC:         ${SOCIETY_BANK_IFSC:-}
      SOCIETY_BANK_BENEFICIARY:  ${SOCIETY_BANK_BENEFICIARY:-}
      GMAIL_SMTP_USER:           ${GMAIL_SMTP_USER:-}
      GMAIL_APP_PASSWORD:        ${GMAIL_APP_PASSWORD:-}
      MINIO_ENDPOINT:            http://minio:9000
      MINIO_ACCESS_KEY:          ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY:          ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:              uploads
    volumes:
      - registration_uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Ticket Service (port 3006) ──────────────────────────────────────────
  ticket-service:
    build:
      context: .
      dockerfile: services/ticket/Dockerfile
    restart: always
    environment:
      DB_HOST:           pgbouncer
      DB_PORT:           6432
      DB_NAME:           ${POSTGRES_DB:-society_events}
      # Own DB role (ticket_role), not the shared POSTGRES_USER — see
      # DB_ISOLATION_PLAN.md / db/migrations/034_ticket_service_schema_isolation.sql.
      DB_USER:           ${TICKET_DB_USER}
      DB_PASSWORD:       ${TICKET_DB_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Visitor Service — dedicated Postgres ─────────────────────────────────
  # Deliberately NOT a database inside the shared `postgres` container — visitor
  # management runs against its own Postgres instance so it stays a genuinely
  # independent service (see services/visitor/db/init/01_schema.sql). No host
  # port binding — society_postgres already uses host:${POSTGRES_PORT}; reach
  # this via service name "visitor-postgres:5432" inside the compose network
  # (mirrors ~/payment_reconcilation_service's standalone `db` service).
  visitor-postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-society}_visitor_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${VISITOR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VISITOR_POSTGRES_PASSWORD}
      POSTGRES_DB:       ${VISITOR_POSTGRES_DB:-visitor_service}
    volumes:
      - visitor_postgres_data:/var/lib/postgresql/data
      - ./services/visitor/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VISITOR_POSTGRES_USER} -d ${VISITOR_POSTGRES_DB:-visitor_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - society_net

  # ─── Visitor Service (port 3008) ──────────────────────────────────────────
  visitor-service:
    build:
      context: .
      dockerfile: services/visitor/Dockerfile
    restart: always
    environment:
      DB_HOST:           visitor-postgres
      DB_PORT:           5432
      DB_NAME:           ${VISITOR_POSTGRES_DB:-visitor_service}
      DB_USER:           ${VISITOR_POSTGRES_USER}
      DB_PASSWORD:       ${VISITOR_POSTGRES_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      SOCIETY_NAME:              ${SOCIETY_NAME:-GM Global Techies Town}
      USER_SERVICE_INTERNAL_URL: http://user-service:3001/internal/users
      AUTH_SERVICE_URL:          ${AUTH_SERVICE_URL:-http://host.containers.internal:8000}
      AUTH_SERVICE_API_KEY:      ${AUTH_SERVICE_API_KEY:-}
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
      MINIO_ENDPOINT:            http://minio:9000
      MINIO_ACCESS_KEY:          ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY:          ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:              uploads
    volumes:
      - visitor_uploads:/app/uploads
    depends_on:
      visitor-postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Payment & Reconciliation Service (port 3007) ────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    restart: always
    environment:
      DB_HOST:           pgbouncer
      DB_PORT:           6432
      DB_NAME:           ${POSTGRES_DB:-society_events}
      # Own DB role (payment_role), not the shared POSTGRES_USER — see
      # DB_ISOLATION_PLAN.md / db/migrations/036_payment_service_schema_isolation.sql.
      DB_USER:           ${PAYMENT_DB_USER}
      DB_PASSWORD:       ${PAYMENT_DB_PASSWORD}
      KEYCLOAK_URL:              ${KEYCLOAK_URL:-https://auth.gm-global-techies-town.club}
      KEYCLOAK_REALM:            society-events
      KEYCLOAK_PUBLIC_URL:       ${KEYCLOAK_PUBLIC_URL}
      APP_PUBLIC_URL:            ${APP_PUBLIC_URL}
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      SOCIETY_ID:                11100000-0000-0000-0000-000000000001
      PAYMENT_PROVIDER:          ${PAYMENT_PROVIDER:-MANUAL_UPI}
      PAYMENT_SECRET_KEY:        ${PAYMENT_SECRET_KEY}
      SPLUNK_HEC_URL:            http://host.containers.internal:8088/services/collector/event
      SPLUNK_HEC_TOKEN:          ${SPLUNK_HEC_TOKEN:-}
      AUTH_SERVICE_URL:          ${AUTH_SERVICE_URL:-http://host.containers.internal:8000}
      AUTH_SERVICE_API_KEY:      ${AUTH_SERVICE_API_KEY:-}
      RECONCILIATION_SERVICE_BASE_URL:   ${RECONCILIATION_SERVICE_BASE_URL:-http://host.containers.internal:8001}
      RECONCILIATION_SERVICE_SECRET_KEY: ${PAYMENT_RECONCILIATION_SECRET_KEY}
      RECONCILIATION_SERVICE_AUDIENCE:   payment-service
      # Claude API — alternative to Ollama for the IMAP email parser; selected via
      # ai_provider in payment_reconciliation_settings (PUT /settings), not here.
      ANTHROPIC_API_KEY:         ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL:              ${CLAUDE_MODEL:-claude-sonnet-4-6}
      PAYMENT_SERVICE_ENV:       ${PAYMENT_SERVICE_ENV:-production}
      GMAIL_SMTP_USER:           ${GMAIL_SMTP_USER:-}
      GMAIL_APP_PASSWORD:        ${GMAIL_APP_PASSWORD:-}
      MINIO_ENDPOINT:            http://minio:9000
      MINIO_ACCESS_KEY:          ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY:          ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:              uploads
    volumes:
      - payment_uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3007/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - society_net

  # ─── Shell App ────────────────────────────────────────────────────────────
  # Opt-in only: docker compose --profile frontend up -d --build
  # For local dev use: npm run dev inside frontend/shell (Vite HMR, no Docker)
  frontend:
    profiles: [frontend]
    build:
      context: ./frontend/shell
      dockerfile: Dockerfile
      args:
        VITE_MODE: ${VITE_MODE:-production}
        VITE_APP_ENV: ${VITE_APP_ENV:-prod}
        VITE_GOOGLE_LOGIN: ${VITE_GOOGLE_LOGIN:-}
        VITE_PHONE_LOGIN: ${VITE_PHONE_LOGIN:-}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-}
    container_name: ${COMPOSE_PROJECT_NAME:-society}_frontend
    restart: always
    # No host port — served by nginx at /
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - society_net

  # ─── MFE: Admin ─────────────────────────────────────────────────────────────
  mfe-admin:
    profiles: [frontend]
    build:
      context: ./frontend/mfe-admin
      dockerfile: Dockerfile
      args:
        VITE_MODE: ${VITE_MODE:-production}
    container_name: ${COMPOSE_PROJECT_NAME:-society}_mfe_admin
    restart: always
    # No host port — served by nginx at /mfe-admin/
    healthcheck:
