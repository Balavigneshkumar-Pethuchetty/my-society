worker_processes  auto;
error_log         /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # JSON format — parsed by Fluent Bit and shipped to Splunk society_web_access index
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"query":"$query_string",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time_s":$request_time,'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"cf_ray":"$http_cf_ray"'
        '}';
    access_log /var/log/nginx/access.log json_access;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 20M;

    # DNS resolver — injected at container startup by docker-entrypoint.sh
    # so it works for both Docker (127.0.0.11) and Podman (10.89.0.1 or similar).
    resolver __RESOLVER__ valid=5s ipv6=off;

    # ── Detect real scheme from Cloudflare CF-Visitor header ─────────────────
    # Cloudflare terminates HTTPS and forwards HTTP to nginx, so $scheme is
    # always "http". CF-Visitor carries the original scheme; fall back to
    # $scheme for direct (non-Cloudflare) access e.g. localhost dev.
    map $http_cf_visitor $real_scheme {
        default                  $scheme;
        ~*"scheme"\s*:\s*"https" https;
        ~*"scheme"\s*:\s*"http"  http;
    }

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=general:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m       rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=admin:10m      rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=otp_login:10m  rate=3r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen __NGINX_PORT__ default_server;
        server_name _;

        # Keep OAuth callback URLs canonical. The Google OAuth client is
        # configured for the apex domain, so redirect www before Keycloak builds
        # its broker redirect_uri.
        if ($host = www.gm-global-techies-town.club) {
            return 301 $real_scheme://gm-global-techies-town.club$request_uri;
        }

        limit_conn perip 30;

        # ── Security headers (applied to frontend & admin paths) ─────────────
        # X-Frame-Options is NOT set here globally — Keycloak manages its own
        # frame policy and needs iframes for OIDC flows. It is added per-location
        # below only for the frontend and admin tools.
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-XSS-Protection        "1; mode=block"                   always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        # camera=(self) — the gate-entry QR scanner (/scanner) needs getUserMedia
        # for the security guard's phone camera. geolocation=(self) — the event
        # location picker's "Use current location" needs it; microphone stays locked down.
        add_header Permissions-Policy      "geolocation=(self), microphone=(), camera=(self)" always;

        # ── Block common scanner / exploit paths ──────────────────────────────
        # Explicit list — avoids blocking /.well-known/ (needed for OIDC discovery)
        location ~* \.(php|asp|aspx|jsp|cgi)$ { deny all; return 404; }
        location ~* /(wp-admin|wp-login|phpmyadmin|xmlrpc\.php|etc/passwd) {
            deny all; return 404;
        }
        location ~ /\.(git|env|svn|ssh|htaccess|DS_Store|hg|travis|circleci) {
            deny all; return 404;
        }

        # ── Internal health probe ─────────────────────────────────────────────
        location = /nginx-health {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny  all;
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Keycloak is now served by the centralized auth-service at
        # https://auth.gm-global-techies-town.club — no local proxy needed.

        # ── pgAdmin (/pgadmin/) — basic auth protected ────────────────────────
        # Do NOT strip the /pgadmin/ prefix: pgAdmin's container now runs with
        # SCRIPT_NAME=/pgadmin (see docker-compose.yml), which makes gunicorn
        # itself require every incoming request path to already start with
        # /pgadmin (it strips the prefix internally and populates WSGI
        # SCRIPT_NAME/PATH_INFO correctly) — Flask then generates all of
        # pgAdmin's own asset URLs, redirects, and AJAX calls already correctly
        # prefixed. Stripping the prefix here would make gunicorn 500 every
        # request with "Configuration problem: Request path ... does not start
        # with SCRIPT_NAME '/pgadmin'".
        location /pgadmin/ {
            limit_req zone=admin burst=15 nodelay;
            auth_basic           "Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $pg http://pgadmin:80;
            proxy_pass           $pg;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $real_scheme;
            proxy_read_timeout   30s;
        }

        # ── Swagger UI — restricted to local network only ────────────────────
        location ~* ^/api/users/(docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            set $us http://user-service:3001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $us;
            proxy_set_header Host $http_host;
        }

        # ── Swagger UI OAuth2 redirect (exact match) ─────
        # Route to /docs/oauth2-redirect after stripping /api/ prefix
        location = /api/users/docs/oauth2-redirect {
            set $us http://user-service:3001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass           $us;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
        }

        # ── Event Service Swagger UI — restricted to local network only ────────
        location ~* ^/api/events/(docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            set $es http://event-service:3002;
            rewrite ^/api/events/(.*)$ /$1 break;
            proxy_pass $es;
            proxy_set_header Host $http_host;
        }

        # ── Event Service (/api/events/) ──────────────────────────────────────
        location /api/events/ {
            limit_req zone=general burst=40 nodelay;
            set $es http://event-service:3002;
            rewrite ^/api/events/(.*)$ /$1 break;
            proxy_pass           $es;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   30s;
        }

        # ── Registration Service Swagger UI — restricted to local network ──────
        location ~* ^/api/registrations/(docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            set $rs http://registration-service:3005;
            rewrite ^/api/registrations/(.*)$ /$1 break;
            proxy_pass $rs;
            proxy_set_header Host $http_host;
        }

        # ── Registration Service (/api/registrations/) ────────────────────────
        location /api/registrations/ {
            limit_req zone=general burst=40 nodelay;
            client_max_body_size 12M;
            set $rs http://registration-service:3005;
            rewrite ^/api/registrations/(.*)$ /$1 break;
            proxy_pass           $rs;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   60s;
        }

        # ── Ticket Service Swagger UI — restricted to local network ──────────
        location ~* ^/api/tickets/(docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            set $ts http://ticket-service:3006;
            rewrite ^/api/tickets/(.*)$ /$1 break;
            proxy_pass $ts;
            proxy_set_header Host $http_host;
        }

        # ── Ticket Service (/api/tickets/) ────────────────────────────────────
        location /api/tickets/ {
            limit_req zone=general burst=40 nodelay;
            set $ts http://ticket-service:3006;
            rewrite ^/api/tickets/(.*)$ /$1 break;
            proxy_pass           $ts;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   60s;
        }

        # ── Visitor Service Swagger UI — restricted to local network ─────────
        location ~* ^/api/visitors/(docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            set $vs http://visitor-service:3008;
            rewrite ^/api/visitors/(.*)$ /$1 break;
            proxy_pass $vs;
            proxy_set_header Host $http_host;
        }

        # ── Visitor Service (/api/visitors/) ──────────────────────────────────
        location /api/visitors/ {
            limit_req zone=general burst=40 nodelay;
            client_max_body_size 8M;
            set $vs http://visitor-service:3008;
            rewrite ^/api/visitors/(.*)$ /$1 break;
            proxy_pass           $vs;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   60s;
        }

        # Phone-OTP login — stricter than general to blunt SMS-bombing via
        # /request; matched ahead of the general /api/users/ block below
        # since nginx prefers the longer prefix match.
        location /api/users/users/auth/phone-login/ {
            limit_req zone=otp_login burst=3 nodelay;
            set $us http://user-service:3001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass           $us;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   30s;
        }

        # ── User Service (/api/users/) ────────────────────────────────────────
        location /api/users/ {
            limit_req zone=general burst=40 nodelay;
            set $us http://user-service:3001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass           $us;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout   30s;
        }

        # ── Payment & Reconciliation Service (/api/payments/) ────────────────
        location /api/payments/ {
            limit_req zone=general burst=40 nodelay;
            set $ps http://payment-service:3007;
            rewrite ^/api/payments/(.*)$ /$1 break;
            proxy_pass           $ps;
            proxy_set_header     Host               $http_host;
            proxy_set_header     X-Forwarded-Host   $http_host;
            proxy_set_header     X-Forwarded-Proto  $real_scheme;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $proxy_add_x_forwarded_for;
            # Screenshot parsing/verification calls out to Ollama vision inference,
            # which can take well over 30s (especially cold) — give it real headroom.
            # Kept above payment-service's own 110s httpx client timeout (see
            # reconciliation_client.py) so that timeout fires first with a clear
            # error message instead of nginx cutting the connection generically.
            proxy_read_timeout   120s;
        }

        # ── Uploads (avatars/payment-screenshots/visitors) — proxied to MinIO ──
        # Avatars, payment screenshots (both registration- and payment-service),
        # and visitor photos are stored in MinIO under a single `uploads` bucket,
        # keyed by the same relative path previously used on local disk (e.g.
        # avatars/<uuid>.jpg) — so DB-stored URLs need no change. This regex is
        # more specific than each service's own /api/<service>/ prefix block, so
        # it takes precedence for these paths regardless of file order (nginx
        # always prefers a matching regex location over a plain-prefix one).
        location ~* ^/api/(users|registrations|visitors|payments)/uploads/(.+)$ {
            limit_req zone=general burst=40 nodelay;
            proxy_pass          http://minio:9000/uploads/$2;
            proxy_set_header    Host              minio;
            proxy_read_timeout  30s;
        }

        # ── MFE remoteEntry.js — never cached (always fetch latest after a rebuild) ─
        # Covers all 6 MFEs (tickets/visitors added alongside the new long-cache assets
        # rule below): they were previously protected only incidentally, by the inner
        # MFE nginx's own blanket no-cache-for-all-.js rule — that protection no longer
        # applies now that our long-cache rule strips the upstream's Cache-Control, so
        # this regex must cover every MFE that ships a remoteEntry.js, not just 4 of 6.
        location ~* ^/mfe-(admin|events|booking|tickets|payment|visitors)/assets/remoteEntry\.js$ {
            limit_req zone=general burst=40 nodelay;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
            set $mfe_host http://mfe-$1:80;
            rewrite ^/mfe-(?:admin|events|booking|tickets|payment|visitors)/(.*)$ /$1 break;
            proxy_pass          $mfe_host;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE + frontend hashed assets — cache aggressively for a year ──────
        # Vite content-hashes these filenames (e.g. index-a1b2c3d4.js), so a new build
        # always produces new URLs — safe to cache immutably. Listed AFTER the
        # remoteEntry.js regex block above: nginx evaluates regex locations in file
        # order and uses the first match, so remoteEntry.js keeps winning there and
        # never falls through to this broader rule.
        location ~* ^/mfe-(admin|events|booking|tickets|payment|visitors)/assets/ {
            limit_req zone=general burst=40 nodelay;
            # Each MFE's own bundled nginx (frontend/mfe-*/nginx.conf) sets a blanket,
            # non-hash-aware "no-cache" on every .js file — proxy_hide_header strips that
            # so our long-cache header is the only Cache-Control the client sees, rather
            # than both arriving as separate, conflicting header lines.
            proxy_hide_header  Cache-Control;
            proxy_hide_header  Expires;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            set $mfe_host http://mfe-$1:80;
            rewrite ^/mfe-(?:admin|events|booking|tickets|payment|visitors)/(.*)$ /$1 break;
            proxy_pass          $mfe_host;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        location ~* ^/assets/ {
            limit_req zone=general burst=40 nodelay;
            # See the mfe assets block above — the shell's own bundled nginx sets a
            # blanket "no-cache" on .js regardless of hashing; strip it so only our
            # long-cache header reaches the client.
            proxy_hide_header  Cache-Control;
            proxy_hide_header  Expires;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            set $fe_assets http://frontend:80;
            proxy_pass          $fe_assets;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Admin (/mfe-admin/) ─────────────────────────────────────────
        location /mfe-admin/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_admin http://mfe-admin:80;
            rewrite ^/mfe-admin/(.*)$ /$1 break;
            proxy_pass          $mfe_admin;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Events (/mfe-events/) ───────────────────────────────────────
        location /mfe-events/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_events http://mfe-events:80;
            rewrite ^/mfe-events/(.*)$ /$1 break;
            proxy_pass          $mfe_events;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Booking (/mfe-booking/) ─────────────────────────────────────
        location /mfe-booking/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_booking http://mfe-booking:80;
            rewrite ^/mfe-booking/(.*)$ /$1 break;
            proxy_pass          $mfe_booking;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Tickets (/mfe-tickets/) ─────────────────────────────────────
        location /mfe-tickets/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_tickets http://mfe-tickets:80;
            rewrite ^/mfe-tickets/(.*)$ /$1 break;
            proxy_pass          $mfe_tickets;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Payment (/mfe-payment/) ─────────────────────────────────────
        location /mfe-payment/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_payment http://mfe-payment:80;
            rewrite ^/mfe-payment/(.*)$ /$1 break;
            proxy_pass          $mfe_payment;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── MFE: Visitors (/mfe-visitors/) ────────────────────────────────────
        location /mfe-visitors/ {
            limit_req zone=general burst=40 nodelay;
            set $mfe_visitors http://mfe-visitors:80;
            rewrite ^/mfe-visitors/(.*)$ /$1 break;
            proxy_pass          $mfe_visitors;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }

        # ── Frontend (/) — catch-all, must be last ────────────────────────────
        location / {
            limit_req zone=general burst=40 nodelay;
            set $fe http://frontend:80;
            proxy_pass          $fe;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $real_scheme;
            proxy_read_timeout  30s;
        }
    }

    # ── pgadmin.gm-global-techies-town.club ──────────────────────────────────
    server {
        listen __NGINX_PORT__;
        server_name pgadmin.gm-global-techies-town.club;

        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-XSS-Protection        "1; mode=block"                   always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        limit_conn perip 10;

        # pgAdmin's container runs with SCRIPT_NAME=/pgadmin (see docker-compose.yml)
        # so gunicorn requires every request to already carry that prefix — add it
        # here (visitors to this subdomain never see it), and strip it back out of
        # any outgoing Location header so redirects still land on this subdomain's
        # bare paths instead of leaking /pgadmin into the visible URL.
        location / {
            limit_req zone=admin burst=15 nodelay;
            auth_basic           "Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $pg http://pgadmin:80;
            rewrite ^/(.*)$ /pgadmin/$1 break;
            proxy_pass           $pg;
            proxy_redirect       /pgadmin/ /;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $real_scheme;
            proxy_read_timeout   30s;
        }
    }

}

